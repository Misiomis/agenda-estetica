<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gimena Knack | Login admin</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile-fixes.css">
    <link rel="stylesheet" href="/pro-theme.css">

    <style>
        body {
            background: linear-gradient(160deg, #060e0b 0%, #0c2218 55%, #071a12 100%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            color: rgba(220,242,232,0.92);
            font-family: 'Cormorant Garamond', serif;
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            max-width: 300px;
            padding: 12px 14px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 12px;
            outline: none;
            background: rgba(255,255,255,0.07);
            color: rgba(220,242,232,0.95);
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder { color: rgba(160,205,185,0.40); }

        input:focus {
            border-color: rgba(255,255,255,0.28);
            background: rgba(255,255,255,0.11);
            box-shadow: 0 0 0 3px rgba(53,122,92,0.18);
        }

        button {
            width: 100%;
            max-width: 300px;
            padding: 14px;
            background: linear-gradient(135deg, #4e9d7a 0%, #357a5c 100%);
            color: rgba(230,248,238,0.97);
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: filter 0.2s, transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 24px rgba(0,0,0,0.30);
        }

        button:hover {
            filter: brightness(1.10);
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.38);
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: rgba(140,185,165,0.50);
            padding-bottom: 30px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Acceso Administrativo</h1>

        <input type="text" id="adminUser" placeholder="Usuario">
        <input type="password" id="adminPass" placeholder="Contraseña">
        
        <button onclick="loginAdmin()">Ingresar</button>

        <p id="errorMsg" style="color:red; margin-top: 10px;"></p>
    </div>

    <div class="footer">
        © 2026 Espacio Mimar T — Todos los derechos reservados
    </div>

    <script>
        const ADMIN_USER = "gimena";
        const ADMIN_PASS = "Mimar2026";

        function loginAdmin() {
            const user = document.getElementById("adminUser").value;
            const pass = document.getElementById("adminPass").value;

            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                localStorage.setItem("adminAuth", "true");
                window.location.href = "admin.html";
            } else {
                document.getElementById("errorMsg").innerText = "Datos incorrectos";
            }
        }
    </script>

    <script src="/js/shared-footer.js"></script>
</body>
</html>
