<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espacio Mimar T | Próximamente</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="img/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }

        body {
            font-family: 'Jost', sans-serif;
            font-weight: 300;
            background: #0e1a14;
            color: #d0d8d3;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
        }

        /* Fondo con glow sutil */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse 70% 55% at 50% 40%, rgba(60,179,113,0.10) 0%, transparent 70%),
                radial-gradient(ellipse 40% 30% at 20% 80%, rgba(45,143,94,0.06) 0%, transparent 60%);
            pointer-events: none;
        }

        /* Partículas decorativas */
        .particles {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 1.5px; height: 1.5px;
            background: rgba(74,222,128,0.25);
            border-radius: 50%;
            animation: float linear infinite;
        }
        @keyframes float {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 0.4; }
            100% { transform: translateY(-20px) scale(1.5); opacity: 0; }
        }

        /* Card central */
        .card {
            position: relative; z-index: 1;
            text-align: center;
            padding: clamp(40px, 8vw, 72px) clamp(28px, 6vw, 64px);
            max-width: min(520px, 92vw);
            animation: fadeUp 0.9s cubic-bezier(0.22,0.82,0.44,1) both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .logo-wrap {
            margin-bottom: 28px;
        }
        .logo-wrap img {
            width: clamp(72px, 16vw, 96px);
            height: clamp(72px, 16vw, 96px);
            object-fit: contain;
            border-radius: 50%;
            border: 1px solid rgba(60,179,113,0.20);
            padding: 10px;
            background: rgba(60,179,113,0.06);
            box-shadow: 0 0 32px rgba(60,179,113,0.12);
        }

        /* Gem divider */
        .gem {
            display: flex; align-items: center; gap: 12px;
            justify-content: center; margin: 0 0 22px;
        }
        .gem::before, .gem::after {
            content: '';
            flex: 1; max-width: 60px; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(60,179,113,0.30));
        }
        .gem::after { transform: scaleX(-1); }
        .gem-icon { color: rgba(74,222,128,0.55); font-size: 12px; }

        /* Brand name */
        .brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.1rem, 4vw, 1.35rem);
            font-weight: 300;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(165,205,188,0.65);
            margin-bottom: 28px;
        }

        /* Heading */
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.1rem, 7vw, 3.1rem);
            font-weight: 300;
            line-height: 1.18;
            color: #ffffff;
            letter-spacing: 0.01em;
            margin-bottom: 16px;
        }
        h1 em {
            font-style: italic;
            color: #4ade80;
        }

        /* Subtext */
        .sub {
            font-size: clamp(0.84rem, 2.5vw, 0.95rem);
            color: rgba(165,205,188,0.60);
            line-height: 1.75;
            margin-bottom: 36px;
            font-weight: 300;
        }

        /* Divider line */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(60,179,113,0.25), transparent);
            margin: 0 auto 32px;
            max-width: 180px;
        }

        /* WhatsApp link */
        .wa-link {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 13px 26px;
            border-radius: 100px;
            border: 1px solid rgba(37,211,102,0.28);
            background: rgba(37,211,102,0.07);
            color: #4ade80;
            text-decoration: none;
            font-family: 'Jost', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: all 0.22s ease;
        }
        .wa-link:hover {
            background: rgba(37,211,102,0.14);
            border-color: rgba(37,211,102,0.50);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37,211,102,0.15);
        }
        .wa-link svg { flex-shrink: 0; }

        /* Decorative corner lines */
        .corner {
            position: fixed;
            width: 40px; height: 40px;
            opacity: 0.25;
        }
        .corner--tl { top: 24px; left: 24px; border-top: 1px solid #3cb371; border-left: 1px solid #3cb371; }
        .corner--tr { top: 24px; right: 24px; border-top: 1px solid #3cb371; border-right: 1px solid #3cb371; }
        .corner--bl { bottom: 24px; left: 24px; border-bottom: 1px solid #3cb371; border-left: 1px solid #3cb371; }
        .corner--br { bottom: 24px; right: 24px; border-bottom: 1px solid #3cb371; border-right: 1px solid #3cb371; }
    </style>
</head>
<body>

<!-- Esquinas decorativas -->
<div class="corner corner--tl"></div>
<div class="corner corner--tr"></div>
<div class="corner corner--bl"></div>
<div class="corner corner--br"></div>

<!-- Partículas flotantes -->
<div class="particles" id="particles"></div>

<!-- Contenido central -->
<div class="card">
    <div class="logo-wrap">
        <img src="img/logo.png" alt="Espacio Mimar T">
    </div>

    <div class="brand">Espacio Mimar T</div>

    <div class="gem"><span class="gem-icon">✦</span></div>

    <h1>Página en<br><em>mantenimiento</em></h1>

    <p class="sub">
        Estamos preparando algo especial.<br>
        Pronto vas a poder reservar tu turno online.
    </p>

    <div class="divider"></div>

    <a class="wa-link"
        href="https://wa.me/5493764291807?text=Hola!%20Vi%20la%20web%20de%20Espacio%20Mimar%20T%20y%20quiero%20consultar%20sobre%20turnos."
        target="_blank" rel="noopener noreferrer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        Consultanos por WhatsApp
    </a>
</div>

<script>
    // Partículas flotantes
    (function() {
        const cont = document.getElementById('particles');
        const N = 18;
        for (let i = 0; i < N; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.cssText = [
                `left:${Math.random()*100}%`,
                `width:${1 + Math.random()*2}px`,
                `height:${1 + Math.random()*2}px`,
                `animation-duration:${8 + Math.random()*14}s`,
                `animation-delay:${-Math.random()*20}s`,
                `opacity:${0.15 + Math.random()*0.35}`
            ].join(';');
            cont.appendChild(p);
        }
    })();
</script>
</body>
</html>
