<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123222"/>
      <stop offset="1" stop-color="#0a1f15"/>
    </linearGradient>
    <linearGradient id="bell" x1="512" y1="220" x2="512" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7f2e7"/>
      <stop offset="1" stop-color="#eadfc8"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- subtle radial glow -->
  <circle cx="512" cy="470" r="340" fill="#1f6b47" opacity="0.22"/>

  <!-- bell body -->
  <path d="M512 220
           C 400 220 340 305 340 430
           L 340 560
           C 340 600 320 630 285 655
           C 270 665 275 690 295 690
           L 729 690
           C 749 690 754 665 739 655
           C 704 630 684 600 684 560
           L 684 430
           C 684 305 624 220 512 220 Z"
        fill="url(#bell)" stroke="#dcceac" stroke-width="6"/>

  <!-- bell clapper -->
  <circle cx="512" cy="742" r="42" fill="#f7f2e7" stroke="#dcceac" stroke-width="6"/>

  <!-- leaf / pulse mark on the bell, esmeralda -->
  <g transform="translate(512 450)">
    <path d="M-96 40
             C -70 -60 -20 -110 40 -120
             C 30 -55 -10 -10 -96 40 Z"
          fill="#1f8f5c"/>
    <path d="M96 40
             C 70 -60 20 -110 -40 -120
             C -30 -55 10 -10 96 40 Z"
          fill="#2fae74"/>
    <path d="M0 -128 L0 90" stroke="#0f4d31" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- small notification spark -->
  <circle cx="700" cy="290" r="34" fill="#2fae74"/>
  <circle cx="700" cy="290" r="34" fill="none" stroke="#123222" stroke-width="10"/>
</svg>
